<script>
/*
 * ForgeDrive incremental TiddlyWiki client — experimental.
 * One append-only shared change log, never an individual Drive file per tiddler.
 * Requests run via Apps Script HTML Service google.script.run.
 *
 * Background means "while the wiki tab is open". Closing the tab does not
 * guarantee that pending changes have reached Drive.
 */
(function () {
  "use strict";
  const QUIET_MS = 2500;
  const ACTIVE_POLL_MS = 25000;
  const MAX_FIELDS_JSON_LENGTH = 45000; // Keep each Sheets JSON cell under 50K
  const MAX_OPERATIONS = 25;
  // Stay below the Apps Script backend limit of 250,000 JSON characters.
  const MAX_BATCH_CHARS = 200000;

  function id() {
    return "fd_" + Date.now().toString(36) + "_" +
      Math.random().toString(36).slice(2, 14);
  }
  function plainFields(tiddler) {
    const fields = {};
    if (!tiddler || !tiddler.fields) return fields;
    for (const key of Object.keys(tiddler.fields)) {
      fields[key] = typeof tiddler.getFieldString === "function" ?
        tiddler.getFieldString(key) : String(tiddler.fields[key] == null ? "" : tiddler.fields[key]);
    }
    return fields;
  }
  function identicalFields(a, b) {
    if (!a || !b) return false;
    const ak = Object.keys(a).sort(), bk = Object.keys(b).sort();
    if (ak.length !== bk.length || ak.some((k, i) => k !== bk[i])) return false;
    return ak.every(key => a[key] === b[key]);
  }
  class ForgeDriveDelta {
    constructor(options) {
      this.tw = options.tw;
      this.fileId = options.fileId;
      this.rpc = options.rpc;
      this.onStatus = options.onStatus || (() => {});
      this.onState = options.onState || (() => {});
      this.actor = id();
      this.cursor = 0;
      this.revisions = new Map();
      this.pending = new Map();
      this.remoteEchoes = new Map();
      this.conflicts = new Map();
      this.active = false;
      this.canEdit = false;
      this.flushing = false;
      this.pulling = false;
      this.flushTimer = null;
      this.pollTimer = null;
      this.retryTimer = null;
      this.onlineHandler = null;
      this.sequence = 0;
      this.dirtyOutsideSync = false;
      this.unsupported = new Map();
      this.storage = options.storage === undefined ? window.localStorage : options.storage;
      this.recoveryKey = "";
      this.storageFailed = false;
      this.listenerInstalled = false;
      this.bootstrapping = false;
      this.lastPullSucceeded = false;
      this.snapshotSeq = Number(options.snapshotSeq) || 0;
    }
    hasUnsynced() {
      return this.pending.size > 0 || this.flushing ||
        this.conflicts.size > 0 || this.dirtyOutsideSync ||
        this.unsupported.size > 0;
    }
    state() {
      this.onState({
        active: this.active,
        canEdit: this.canEdit,
        pending: this.pending.size,
        conflicts: this.conflicts.size,
        unsupported: this.unsupported.size,
        cursor: this.cursor,
        unsynced: this.hasUnsynced(),
        bootstrapping: this.bootstrapping
      });
    }
    /** Keep unsent edits across a reload; never treat this as remote persistence. */
    persist() {
      if (!this.recoveryKey || !this.storage) return;
      const payload = {
        actor: this.actor,
        pending: [...this.pending.values()],
        conflicts: [...this.conflicts.entries()],
        unsupported: [...this.unsupported.entries()]
      };
      try {
        if (payload.pending.length || payload.conflicts.length || payload.unsupported.length) {
          this.storage.setItem(this.recoveryKey, JSON.stringify(payload));
        } else {
          this.storage.removeItem(this.recoveryKey);
        }
      } catch (error) {
        if (!this.storageFailed) {
          this.storageFailed = true;
          this.onStatus("Browseren kunne ikke sikre lokale synkændringer. Hent straks en lokal HTML-sikkerhedskopi.", true);
        }
      }
    }
    restore() {
      if (!this.recoveryKey || !this.storage) return;
      let saved;
      try { saved = JSON.parse(this.storage.getItem(this.recoveryKey) || "null"); }
      catch (_error) { this.onStatus("Ugyldig lokal synkkø. Hent en lokal sikkerhedskopi.", true); return; }
      if (!saved || !Array.isArray(saved.pending)) return;
      if (typeof saved.actor === "string") this.actor = saved.actor;
      for (const op of saved.pending) {
        if (!op || !op.title || op.title.startsWith("$:/") ||
            !["put","delete"].includes(op.operation) ||
            !Number.isSafeInteger(op.baseSeq) || op.baseSeq < 0 ||
            typeof op.opId !== "string" ||
            (op.operation === "put" && (!op.fields || op.fields.title !== op.title))) continue;
        this.pending.set(op.title, op);
        const wiki = this.tw.wiki;
        const local = wiki.getTiddler(op.title);
        if (op.operation === "delete") {
          if (local) {
            this.remoteEchoes.set(op.title, null);
            wiki.deleteTiddler(op.title);
          }
        } else if (!local || !identicalFields(plainFields(local), op.fields)) {
          this.remoteEchoes.set(op.title, op.fields);
          wiki.addTiddler(new this.tw.Tiddler(op.fields));
        }
      }
      for (const item of saved.conflicts || []) {
        if (Array.isArray(item) && this.pending.has(item[0])) this.conflicts.set(item[0], item[1]);
      }
      for (const item of saved.unsupported || []) {
        if (Array.isArray(item) && typeof item[0] === "string") {
          this.unsupported.set(item[0], item[1]);
        }
      }
      if (this.pending.size || this.unsupported.size || this.conflicts.size)
        this.onStatus("Lokale ikke-synkroniserede ændringer blev gendannet. De er endnu ikke gemt på Drev.", true);
    }
    async start(initialInfo) {
      if (this.active) return true;
      const info = initialInfo || await this.rpc("huSyncInfo", this.fileId);
      if (!info.enabled) return false;
      this.canEdit = !!info.canEdit;
      this.cursor = Number.isSafeInteger(info.snapshotSeq) && info.snapshotSeq >= 0 ?
        info.snapshotSeq : this.snapshotSeq;
      this.recoveryKey = info.accountKey ?
        "forgeDriveDelta.v1:" + this.fileId + ":" + info.accountKey : "";
      if (!this.recoveryKey) {
        // Without account isolation, do not risk leaking locally cached edits
        // from one Google login to another on the same machine.
        this.onStatus("Kontoen kunne ikke identificeres til sikker lokal gendannelse.", true);
      }
      const sh = this.tw.saverHandler;
      if (sh && sh.isDirty && sh.isDirty()) this.dirtyOutsideSync = true;
      this.active = true;
      this.bootstrapping = true;
      this.registerChangeListener();
      this.restore();
      this.state();
      const pulled = await this.pullAll();
      this.bootstrapping = false;
      // In particular, restarting after a failed network request must send
      // pending drafts even if no new typing occurs.
      if (pulled && this.pending.size) this.scheduleFlush();
      this.onlineHandler = () => {
        if (!this.active) return;
        void this.pullAll().then(ok => { if (ok) this.scheduleFlush(); });
      };
      window.addEventListener?.("online", this.onlineHandler);
      this.pollTimer = setInterval(() => {
        if (this.active && navigator.onLine !== false &&
            typeof document !== "undefined" && !document.hidden) {
          void this.pullAll();
        }
      }, ACTIVE_POLL_MS);
      if (pulled) this.onStatus("Baggrundssynkronisering er aktiv.", false);
      this.state();
      return true;
    }
    stop() {
      this.active = false;
      if (this.flushTimer) clearTimeout(this.flushTimer);
      if (this.pollTimer) clearInterval(this.pollTimer);
      if (this.retryTimer) clearTimeout(this.retryTimer);
      if (this.onlineHandler) window.removeEventListener?.("online", this.onlineHandler);
      this.onlineHandler = null;
      this.state();
    }
    registerChangeListener() {
      if (this.listenerInstalled) return;
      this.listenerInstalled = true;
      const wiki = this.tw.wiki;
      wiki.addEventListener("change", changes => {
        if (!this.active) return;
        for (const [title, change] of Object.entries(changes || {})) {
          if (!change || !change.normal) continue;
          if (typeof title !== "string" || title.startsWith("$:/")) {
            // Ignore transient TW UI state; only count special tiddlers if
            // they are included in TiddlyWiki's actual SaverFilter.
            try {
              const sh = this.tw.saverHandler;
              if (typeof sh?.filterFn === "function") {
                const match = sh.filterFn.call(wiki, iterator => {
                  iterator(wiki.getTiddler(title), title);
                });
                if (Array.isArray(match) && match.length > 0) this.dirtyOutsideSync = true;
              }
            } catch (_error) {
              this.dirtyOutsideSync = true; // fail safe
            }
            continue;
          }
          const tiddler = wiki.getTiddler(title);
          const fields = tiddler ? plainFields(tiddler) : null;
          if (this.remoteEchoes.has(title)) {
            const echo = this.remoteEchoes.get(title);
            this.remoteEchoes.delete(title);
            if (echo === null && !fields) continue;
            if (echo && fields && identicalFields(echo, fields)) continue;
          }
          if (!this.canEdit) {
            this.dirtyOutsideSync = true;
            this.onStatus("Denne konto har kun læseadgang. Lokale ændringer kan ikke synkroniseres.", true);
            continue;
          }
          // Large embedded assets/plugins cannot fit in a Sheets cell.
          // Never retry them endlessly or silently mark them synced.
          if (fields && JSON.stringify(fields).length > MAX_FIELDS_JSON_LENGTH) {
            this.pending.delete(title);
            this.unsupported.set(title, "Tiddleren er for stor til Sheets-synk.");
            this.persist();
            this.onStatus("Tiddleren '" + title +
              "' er for stor til baggrundssynk. Brug Gem på Google Drev (hel HTML-kopi).", true);
            continue;
          }
          this.unsupported.delete(title);
          const old = this.pending.get(title);
          this.pending.set(title, {
            title,
            operation: tiddler ? "put" : "delete",
            fields,
            baseSeq: old ? old.baseSeq : (this.revisions.get(title) || 0),
            opId: id(),
            actor: this.actor,
            serial: ++this.sequence
          });
        }
        this.persist();
        this.state();
        this.scheduleFlush();
      });
    }
    scheduleFlush() {
      if (!this.pending.size || !this.canEdit || this.bootstrapping) return;
      if (![...this.pending.keys()].some(title => !this.conflicts.has(title))) return;
      if (this.flushTimer) clearTimeout(this.flushTimer);
      this.flushTimer = setTimeout(() => {
        this.flushTimer = null;
        void this.flush();
      }, QUIET_MS);
    }
    async flush() {
      if (!this.active || this.bootstrapping || this.flushing || !this.canEdit || !this.pending.size) return;
      if (navigator.onLine === false) {
        this.onStatus("Offline: dine tiddlerændringer afventer forbindelse.", true);
        return;
      }
      this.flushing = true;
      this.state();
      const batch = [];
      let budget = 2; // JSON array brackets
      for (const op of this.pending.values()) {
        if (this.conflicts.has(op.title)) continue;
        if (batch.length >= MAX_OPERATIONS) break;
        const length = JSON.stringify(op).length + 1;
        if (budget + length > MAX_BATCH_CHARS) break;
        batch.push(op);
        budget += length;
      }
      if (!batch.length) {
        this.flushing = false;
        this.state();
        return;
      }
      try {
        const result = await this.rpc("huSyncPush", this.fileId, batch.map(op => ({
          title: op.title, operation: op.operation, fields: op.fields,
          baseSeq: op.baseSeq, opId: op.opId, actor: op.actor
        })));
        if (result.conflict) {
          for (const conflict of result.conflicts || []) {
            this.conflicts.set(conflict.title, conflict);
          }
          this.persist();
          this.onStatus("Synkkonflikt i " +
            (result.conflicts || []).map(e => e.title).join(", ") +
            ". Dine lokale ændringer er bevaret. Hent en sikkerhedskopi.", true);
        } else if (!result.ok) {
          throw new Error("Ændringsloggen afviste opdateringen.");
        } else {
          for (const ack of result.accepted || []) {
            this.revisions.set(ack.title, ack.seq);
            const stillQueued = this.pending.get(ack.title);
            if (stillQueued && stillQueued.opId === ack.opId) {
              this.pending.delete(ack.title);
            } else if (stillQueued) {
              stillQueued.baseSeq = ack.seq;
            }
          }
          this.persist();
          // Only reset TW dirty tracking if every change in this batch was
          // acknowledged and no non-synced system edit exists.
          if (!this.hasUnsyncedExceptFlight() && !this.dirtyOutsideSync &&
              !this.unsupported.size) {
            const sh = this.tw.saverHandler;
            if (sh) {
              sh.numChanges = 0;
              sh.updateDirtyStatus();
            }
          }
          const count = (result.accepted || []).length;
          this.onStatus("Synkroniseret " + count +
            (count === 1 ? " tiddler" : " tiddlere") + " i baggrunden.", false);
        }
      } catch (error) {
        this.onStatus("Synkronisering mislykkedes: " +
          (error.message || String(error)) +
          ". Ændringerne er stadig åbne i wikien.", true);
        if (!this.retryTimer) {
          this.retryTimer = setTimeout(() => {
            this.retryTimer = null;
            void this.flush();
          }, 15000);
        }
      } finally {
        this.flushing = false;
        this.state();
        if (this.pending.size && !this.retryTimer) this.scheduleFlush();
      }
    }
    hasUnsyncedExceptFlight() {
      return this.pending.size > 0 || this.conflicts.size > 0;
    }
    async pullAll() {
      if (!this.active || this.pulling || navigator.onLine === false) return false;
      this.pulling = true;
      const beforeLocalEdit = this.sequence;
      let appliedRemote = 0;
      let caughtUp = false;
      try {
        for (let page = 0; page < 100; page++) {
          const result = await this.rpc("huSyncPull", this.fileId, this.cursor, 100);
          if (!result.enabled) {
            this.onStatus("Den delte ændringslog er ikke tilgængelig.", true);
            return false;
          }
          for (const event of result.events || []) {
            if (this.applyRemote(event)) appliedRemote++;
          }
          this.cursor = result.cursor;
          if (!result.hasMore) { caughtUp = true; break; }
        }
        if (!caughtUp) throw new Error("Ændringsloggen er endnu ikke fuldt indlæst. Redigering af snapshots er blokeret.");
        // The native TW SaverHandler also counts REMOTE modifications as
        // dirty. They were already persisted by another user, and must not
        // light up the save indicator in this client. Wait for TW to dispatch
        // its queued change events before resetting the counter. Never reset
        // if any local edit or conflict happened meanwhile.
        if (appliedRemote > 0) {
          await new Promise(resolve => setTimeout(resolve, 0));
          if (!this.pending.size && !this.flushing && !this.conflicts.size &&
              !this.dirtyOutsideSync && !this.unsupported.size &&
              this.sequence === beforeLocalEdit) {
            const sh = this.tw.saverHandler;
            if (sh) {
              sh.numChanges = 0;
              sh.updateDirtyStatus();
            }
          }
        }
        this.lastPullSucceeded = true;
        this.state();
        return true;
      } catch (error) {
        this.lastPullSucceeded = false;
        this.onStatus("Kunne ikke hente ændringer: " +
          (error.message || String(error)), true);
        return false;
      } finally {
        this.pulling = false;
      }
    }
    applyRemote(event) {
      const title = event.title;
      if (!title || title.startsWith("$:/")) return false;
      const prior = this.revisions.get(title) || 0;
      if (event.seq <= prior) return false;
      this.revisions.set(title, event.seq);
      // Never overwrite an unsent or unsupported local edit. Conflicts are
      // isolated by title so other tiddlers continue synchronizing.
      if (this.pending.has(title) || this.unsupported.has(title)) {
        const pending = this.pending.get(title);
        if (!pending || pending.opId !== event.opId) {
          this.conflicts.set(title, {title, actual: event.seq,
            expected: pending ? pending.baseSeq : prior});
          this.persist();
          this.onStatus("Konflikt: " + title +
            " er ændret af en anden bruger. Din lokale version er bevaret.", true);
        }
        return false;
      }
      const wiki = this.tw.wiki;
      if (event.operation === "delete") {
        if (!wiki.getTiddler(title)) return false;
        this.remoteEchoes.set(title, null);
        wiki.deleteTiddler(title);
      } else if (event.operation === "put" && event.fields) {
        const now = wiki.getTiddler(title);
        if (now && identicalFields(plainFields(now), event.fields)) return false;
        this.remoteEchoes.set(title, event.fields);
        wiki.addTiddler(new this.tw.Tiddler(event.fields));
      } else {
        return false;
      }
      return true;
    }
  }
  window.ForgeDriveDelta = ForgeDriveDelta;
})();
</script>
