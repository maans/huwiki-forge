name: Publish Forge homepage from verified sources
on:
  push:
    branches: [main]
    paths:
      - catalog/editions.json
      - editions/forge/manifest.json
      - editions/forge/tiddlers/seed.json
      - editions/forge/tiddlers/design.json
      - 'plugins/**/dist/plugin.json'
      - 'themes/**/dist/theme.json'
      - editions/shared/libraries.json
      - library/plugins/index.html
      - scripts/build-forge-plugin-library.mjs
      - scripts/build-forge-home.mjs
      - scripts/build-forge-plugin-library.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forge-home-publish-main
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild native plugin registry from reviewed packages
        run: node scripts/build-forge-plugin-library.mjs
      - name: Build the deterministic editable Forge landing wiki
        run: |
          node scripts/build-forge-home.mjs
          node scripts/build-forge-home.mjs --check
          git diff --check
      - name: Commit only generated website outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html library/plugins/registry.json editions/forge/tiddlers/edition-index.json editions/forge/tiddlers/featured-plugins.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(forge): publish generated landing wiki and plugin registry'
            git push origin HEAD:main
          fi
