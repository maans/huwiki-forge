name: Forge libraries browser smoke

on:
  pull_request:
    paths:
      - editions/shared/**
      - editions/**/manifest.json
      - library/**
      - community/**
      - catalog/community.json
      - scripts/forge-libraries-browser-smoke.mjs
      - .github/workflows/forge-libraries-browser-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser controller
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify installed Chromium
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Test native plugin install and Community on read-only static server
        env:
          CHROME_BIN: /usr/bin/google-chrome
          NODE_OPTIONS: --max-old-space-size=8192
        run: node scripts/forge-libraries-browser-smoke.mjs
