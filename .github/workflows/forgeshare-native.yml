name: ForgeShare native apps
on:
  pull_request:
    paths:
      - plugins/forgeshare/**
      - plugins/ai/**
      - scripts/*forgeshare*
      - scripts/native-manifest.mjs
      - .github/workflows/forgeshare-native.yml
permissions:
  contents: read
jobs:
  mac:
    needs: windows
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: ForgeShare-Windows-native
          path: plugins/forgeshare/native/compiled
      - run: python3 scripts/build-forgeshare-mac.py
      - run: node scripts/build-forgeshare.mjs
      - run: |
          mkdir -p "$RUNNER_TEMP/ForgeShare-native"
          ditto -x -k plugins/forgeshare/dist/ForgeShare-mac.zip "$RUNNER_TEMP/ForgeShare-native"
          codesign --verify --strict "$RUNNER_TEMP/ForgeShare-native/ForgeShare.app"
          "$RUNNER_TEMP/ForgeShare-native/ForgeShare.app/Contents/MacOS/ForgeShare" --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: ForgeShare-0.1.14-test-builds
          retention-days: 14
          path: |
            plugins/forgeshare/dist/
            plugins/forgeshare/native/compiled/ForgeShare
            plugins/forgeshare/native/compiled/ForgeShare.icns
            plugins/forgeshare/native/compiled/CodeResources
            plugins/forgeshare/native/compiled/mac.json
            plugins/forgeshare/native/compiled/ForgeShare.exe
            plugins/forgeshare/native/compiled/windows.json
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - run: node scripts/forgeshare-browser-smoke.mjs
      - run: npm install --no-save --no-package-lock --ignore-scripts tiddlywiki@5.4.1 playwright-core@1.56.1
      - run: node scripts/forgeshare-funnel-browser-smoke.mjs
      - run: node scripts/forgeshare-vault-browser-smoke.mjs
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - shell: pwsh
        run: |
          & ./plugins/forgeshare/native/windows/build.ps1
          Copy-Item plugins/forgeshare/helper/ForgeShare.mjs plugins/forgeshare/native/compiled/
          $p=Start-Process plugins/forgeshare/native/compiled/ForgeShare.exe -ArgumentList '--self-test' -Wait -PassThru
          if($p.ExitCode -ne 0) { throw 'Native self-test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: ForgeShare-Windows-native
          path: |
            plugins/forgeshare/native/compiled/ForgeShare.exe
            plugins/forgeshare/native/compiled/windows.json
