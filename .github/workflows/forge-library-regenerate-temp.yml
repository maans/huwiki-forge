name: Regenerate Forge library pages (temporary)
on:
  push:
    branches: [fix/forge-plugin-library-name-and-sync-20261115]
    paths:
      - .github/workflows/forge-library-regenerate-temp.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/forge-plugin-library-name-and-sync-20261115
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild changed edition HTML and plugin library
        run: |
          node scripts/build-forge-plugin-library.mjs
          node scripts/build-instantwiki.mjs
          node scripts/build-forge-home.mjs
          node scripts/build-forge-home.mjs --check
          node scripts/build-instantwiki.mjs --check
          npm test
      - name: Commit generated files to the PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html instantwiki/index.html library/plugins/registry.json editions/forge/tiddlers/edition-index.json editions/forge/tiddlers/featured-plugins.json plugins/instantwiki/dist/plugin.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(forge): regenerate published wikis for renamed library'
            git push origin HEAD:fix/forge-plugin-library-name-and-sync-20261115
          fi
