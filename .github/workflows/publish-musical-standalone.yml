name: Publish Musical Studio 0.7 standalone download
on:
  push:
    branches:
      - musical-studio-0.7-download
    paths:
      - .github/workflows/publish-musical-standalone.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: musical-studio-0.7-download
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build offline-ready single-file Musical Edition
        run: node scripts/build-musical-demo.mjs
      - name: Package 0.7 HTML and ZIP
        run: |
          mkdir -p downloads
          cp dist-musical/Forge-Musical-Studio-0.7.0-test.1.html downloads/
          cd downloads
          zip -q -9 Forge-Musical-Studio-0.7.0-test.1.zip Forge-Musical-Studio-0.7.0-test.1.html
          ls -lh Forge-Musical-Studio-0.7.0-test.1.*
      - name: Publish generated test files on download branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Forge-Musical-Studio-0.7.0-test.1.*
          git diff --cached --quiet && exit 0
          git commit -m "Publish downloadable Musical Studio 0.7 test files [skip ci]"
          git push origin HEAD:musical-studio-0.7-download
