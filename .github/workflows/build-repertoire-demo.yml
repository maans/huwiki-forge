name: Build clickable Repertoire Nodebog demo
on:
  push:
    branches: [main]
    paths:
      - 'plugins/repertoire/dist/plugin.json'
      - 'plugins/abc/dist/plugin.json'
      - 'plugins/abc/src/**'
      - 'plugins/abc/plugin-info.json'
      - 'plugins/repertoire/src/**'
      - 'plugins/repertoire/plugin-info.json'
      - 'scripts/build-repertoire-plugin.mjs'
      - 'tests/repertoire-edition.test.mjs'
      - 'scripts/repertoire-browser-smoke.mjs'
      - 'scripts/abc-reader-browser-smoke.mjs'
      - 'editions/silva-ethno-repertoire/manifest.json'
      - 'editions/silva-ethno-repertoire/tiddlers/repertoire-workspace.json'
      - 'editions/silva-ethno-repertoire/tiddlers/config.json'
      - 'scripts/assemble-silba-etno-repertoire.mjs'
      - '.github/workflows/build-repertoire-demo.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repertoire-editable-demo-main
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble common ABC reader from the latest sources
        run: node scripts/build-abc-ui.mjs
      - name: Build Repertoire plugin from versioned source modules
        run: node scripts/build-repertoire-plugin.mjs
      - name: Synchronize native Forge plugin registry
        run: node scripts/build-forge-plugin-library.mjs
      - name: Verify orchestra, setlist and iPad book navigation
        run: node --test tests/repertoire-edition.test.mjs
      - name: Assemble interactive Repertoire demo with original ABC scores
        run: node scripts/assemble-silba-etno-repertoire.mjs
      - name: Install browser controller for iPad reader acceptance
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Check real Nodebog page turning and Music Minus One in Chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/repertoire-browser-smoke.mjs
      - name: Check ABC Vis/Øv fullscreen reading against the same live score
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/abc-reader-browser-smoke.mjs
      - name: Verify actual published HTML includes Nodebog and 17 scores
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const name='editions/silva-ethno-repertoire/index.html';
          const html=fs.readFileSync(name,'utf8');
          for(const token of [
            'Repertoire – Nodebog',
            'huwiki-repertoire-book',
            'Åbn repertoireværksted',
            'Åbn nodebogen',
            'Brudmarch från Jämtland',
            'Cupria Express (Fm)',
            'Repertoire/Saetlister/'
          ])assert.ok(html.includes(token),token+' missing from public HTML');
          assert.ok(Buffer.byteLength(html)>3_000_000,'wiki HTML unexpectedly small');
          const m=JSON.parse(fs.readFileSync('editions/silva-ethno-repertoire/tiddlers/repertoire-workspace.json','utf8'));
          assert.equal(m.filter(t=>t['repertoire-kind']==='orchestra-item').length,17);
          console.log('Repertoire demo has 17 original scores and a book linked from the workshop');
          "
          node scripts/build-repertoire-plugin.mjs --check
          git diff --check
      - name: Commit editable demo HTML to the existing Forge Pages directory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The ABC package is published by its own workflow. Keep this job
          # focused on the assembled demo so concurrent builds can rebase.
          git restore -- plugins/abc/dist/plugin.json
          git add -- plugins/repertoire/dist/plugin.json library/plugins/registry.json editions/silva-ethno-repertoire/index.html
          if ! git diff --cached --quiet; then
            git commit -m "build(repertoire): publish interactive 17-score Nodebog demo"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
