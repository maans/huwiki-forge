name: Build shared ABC musician reader
on:
  push:
    branches: [main]
    paths:
      - 'plugins/abc/src/**'
      - 'plugins/abc/plugin-info.json'
      - 'tests/abc-reader-mode.test.mjs'
      - 'tests/repertoire-catalogue.test.mjs'
      - 'tests/abc-search-player.test.mjs'
      - 'tests/abc-automatic-layout.test.mjs'
      - 'tests/abc-balanced-layout.test.mjs'
      - 'scripts/abc-leadsheet-layout-browser-smoke.mjs'
      - 'scripts/build-repertoire-catalogue.mjs'
      - 'tests/abc-reader-edit.test.mjs'
      - 'tests/abc-ipad-lite-editor.test.mjs'
      - 'tests/abc-repeat-volta.test.mjs'
      - 'tests/abc-reader-fallback.test.mjs'
      - 'tests/abc-mini-mixer-title.test.mjs'
      - 'tests/abc-default-minimal.test.mjs'
      - 'tests/abc-chord-overview.test.mjs'
      - 'tests/abc-normal-clean.test.mjs'
      - 'tests/abc-rhythm-head-audio.test.mjs'
      - 'tests/abc-swing-voicings.test.mjs'
      - 'tests/abc-swing-arrangement.test.mjs'
      - 'tests/abc-dance-styles.test.mjs'
      - 'tests/abc-slow-ballad.test.mjs'
      - 'tests/abc-swing-written-comp.test.mjs'
      - 'tests/abc-playback-preparing.test.mjs'
      - 'tests/abc-playback-feedback.test.mjs'
      - 'tests/music-edition.test.mjs'
      - 'scripts/build-abc-ui.mjs'
      - 'scripts/abc-swing-browser-smoke.mjs'
      - 'scripts/abc-playback-preparing-browser-smoke.mjs'
      - 'scripts/update_abc_plugin.py'
      - '.github/workflows/build-abc-reader.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: abc-musician-reader-build-main
  cancel-in-progress: true
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build ABC with existing audio/sample bundles untouched
        run: |
          node scripts/build-abc-ui.mjs
          node scripts/build-musescore-import.mjs
      - name: Synchronize TiddlyWiki's native plugin registry
        run: node scripts/build-forge-plugin-library.mjs
      - name: Install TiddlyWiki for source and importer tests
        run: npm ci --ignore-scripts
      - name: Verify the full reader, original fallback, Music Edition and plugin registry
        run: |
          node --test tests/repertoire-catalogue.test.mjs tests/abc-search-player.test.mjs tests/abc-automatic-layout.test.mjs tests/abc-balanced-layout.test.mjs
          node --test tests/abc-reader-mode.test.mjs tests/abc-reader-edit.test.mjs tests/abc-repeat-volta.test.mjs tests/abc-reader-fallback.test.mjs tests/abc-mini-mixer-title.test.mjs tests/abc-default-minimal.test.mjs tests/abc-chord-overview.test.mjs tests/abc-normal-clean.test.mjs tests/music-edition.test.mjs tests/forge-libraries.test.mjs
          node --test tests/abc-slow-ballad.test.mjs tests/abc-dance-styles.test.mjs tests/abc-rhythm-head-audio.test.mjs tests/abc-swing-voicings.test.mjs tests/abc-swing-arrangement.test.mjs tests/abc-swing-written-comp.test.mjs
          node --test tests/abc-playback-preparing.test.mjs tests/abc-playback-feedback.test.mjs
          node scripts/build-abc-ui.mjs --check
          git diff --check
      - name: Install browser controller for actual guitar playback acceptance
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify guitar gain, bright piano and both click previews
        run: node scripts/abc-swing-browser-smoke.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - uses: actions/checkout@v4
        with:
          repository: maans/hjem
          ref: main
          path: .leadsheet-fixtures
          sparse-checkout: catalog/repertoire
          persist-credentials: false
      - name: Verify measured automatic layout on every shared leadsheet in C, B-flat and E-flat
        run: node scripts/abc-leadsheet-layout-browser-smoke.mjs --catalog .leadsheet-fixtures/catalog/repertoire
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Preserve leadsheet layout diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abc-leadsheet-layout
          path: test-results/leadsheet-layout/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve rendered guitar diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: abc-swing-playback
          path: test-results/swing/
          retention-days: 7
      - name: Verify immediate preparation feedback on all player controls
        run: node scripts/abc-playback-preparing-browser-smoke.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Preserve playback preparation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abc-playback-preparing
          path: test-results/playback-preparing/
          if-no-files-found: ignore
          retention-days: 7
      - name: Update existing Forge wikis with the same verified release
        run: |
          node scripts/build-forge-home.mjs
          node scripts/build-forge-home.mjs --check
          python3 scripts/update_abc_plugin.py --plugin plugins/abc/dist/plugin.json editions/akustisk-elektrisk-repertoire/index.html
          git diff --check
      - name: Publish versioned ABC plugin and matching native registry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- plugins/abc/dist/plugin.json library/plugins/registry.json index.html editions/forge/tiddlers/edition-index.json editions/forge/tiddlers/featured-plugins.json editions/akustisk-elektrisk-repertoire/index.html
          if ! git diff --cached --quiet; then
            git commit -m "build(abc): publish musician reader and synchronized plugin registry"
            pushed=0
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
            done
            test "$pushed" -eq 1
          fi




