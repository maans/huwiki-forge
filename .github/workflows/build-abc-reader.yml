name: Build shared ABC musician reader
on:
  push:
    branches: [main]
    paths:
      - 'plugins/abc/src/**'
      - 'plugins/abc/plugin-info.json'
      - 'tests/abc-reader-mode.test.mjs'
      - 'tests/abc-reader-fallback.test.mjs'
      - 'tests/abc-mini-mixer-title.test.mjs'
      - 'tests/music-edition.test.mjs'
      - 'scripts/build-abc-ui.mjs'
      - '.github/workflows/build-abc-reader.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: abc-musician-reader-build-main
  cancel-in-progress: true
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build ABC with existing audio/sample bundles untouched
        run: node scripts/build-abc-ui.mjs
      - name: Synchronize TiddlyWiki's native plugin registry
        run: node scripts/build-forge-plugin-library.mjs
      - name: Install TiddlyWiki for source and importer tests
        run: npm ci --ignore-scripts
      - name: Verify the full reader, original fallback, Music Edition and plugin registry
        run: |
          node --test tests/abc-reader-mode.test.mjs tests/abc-reader-fallback.test.mjs tests/abc-mini-mixer-title.test.mjs tests/music-edition.test.mjs tests/forge-libraries.test.mjs
          node scripts/build-abc-ui.mjs --check
          git diff --check
      - name: Publish versioned ABC plugin and matching native registry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- plugins/abc/dist/plugin.json library/plugins/registry.json
          if ! git diff --cached --quiet; then
            git commit -m "build(abc): publish musician reader and synchronized plugin registry"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
