name: Verify and stage balanced ABC layout
on:
  push:
    branches: [feat/abc-balanced-voltas]
    paths:
      - 'plugins/abc/src/**'
      - 'plugins/abc/plugin-info.json'
      - 'editions/silba-atno-repertoire/tiddlers/**'
      - 'scripts/abc-balanced-layout-browser-smoke.mjs'
      - 'tests/abc-balanced-layout.test.mjs'
      - '.github/workflows/abc-balanced-layout.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: abc-balanced-layout-stage
  cancel-in-progress: true
jobs:
  stage:
    if: github.ref == 'refs/heads/feat/abc-balanced-voltas'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Build reproducible packages, homepage and the real Repertoire demo
        run: |
          node scripts/build-abc-ui.mjs
          node scripts/build-forge-plugin-library.mjs
          node scripts/build-forge-home.mjs
          node scripts/assemble-silba-etno-repertoire.mjs
      - name: Verify musical invariants and measured one-page layout
        run: |
          node --test tests/abc-balanced-layout.test.mjs tests/abc-notation-quality.test.mjs tests/abc-transposed-layout.test.mjs tests/abc-repeat-volta.test.mjs
          node scripts/abc-balanced-layout-browser-smoke.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purim-balanced-layout
          path: test-results/balanced-layout/
          retention-days: 7
      - name: Stage only verified generated files for review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/abc/dist/plugin.json library/plugins/registry.json index.html editions/silba-atno-repertoire/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build(abc): stage verified balanced Purim layout'
            git push origin HEAD:feat/abc-balanced-voltas
          fi
