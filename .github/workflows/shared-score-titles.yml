name: Verify shared score titles and visible iPad mixer
on:
  push:
    branches: [fix/shared-score-titles-ipad-mixer]
    paths:
      - 'plugins/abc/src/**'
      - 'plugins/abc/plugin-info.json'
      - 'editions/silba-atno-repertoire/tiddlers/**'
      - 'scripts/**'
      - 'tests/repertoire-neutral-titles.test.mjs'
      - '.github/workflows/shared-score-titles.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shared-score-titles-stage
  cancel-in-progress: true
jobs:
  stage:
    if: github.ref == 'refs/heads/fix/shared-score-titles-ipad-mixer'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 @xmldom/xmldom@0.9.8
      - name: Use the pinned browsers already installed in the test image
        run: node --input-type=module -e "import {chromium} from 'playwright'; console.log('CHROME_BIN='+chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Rebuild shared pieces, plugin, registry, homepage and repertoire
        run: |
          node scripts/build-abc-ui.mjs
          node scripts/build-silba-etno-repertoire.mjs
          node scripts/build-forge-plugin-library.mjs
          node scripts/build-forge-home.mjs
          node scripts/assemble-silba-etno-repertoire.mjs
      - name: Check titles, references, unchanged notation and legacy links
        run: node --test tests/repertoire-neutral-titles.test.mjs tests/repertoire-edition.test.mjs tests/abc-balanced-layout.test.mjs tests/abc-mini-mixer-title.test.mjs
      - name: Touch-test mixer in iPad WebKit
        env:
          ABC_READER_BROWSER: webkit
        run: node scripts/abc-mixer-visibility-browser-smoke.mjs
      - name: Touch-test mixer in Chromium
        env:
          ABC_READER_BROWSER: chromium
        run: node scripts/abc-mixer-visibility-browser-smoke.mjs
      - name: Verify normal repertoire, cue/PDF entry and Purim page layout
        run: |
          node scripts/repertoire-browser-smoke.mjs
          node scripts/repertoire-cues-browser-smoke.mjs
          node scripts/abc-balanced-layout-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-score-titles-and-mixer
          path: |
            test-results/mixer-visibility/
            test-results/balanced-layout/
          retention-days: 7
      - name: Commit tested generated files to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/abc/dist/plugin.json library/plugins/registry.json index.html editions/silba-atno-repertoire/index.html editions/silba-atno-repertoire/tiddlers/repertoire.json editions/silba-atno-repertoire/conversion-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish tested neutral score titles and visible iPad mixer'
            git push origin HEAD:fix/shared-score-titles-ipad-mixer
          fi
