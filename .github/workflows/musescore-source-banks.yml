name: MuseScore source banks
on:
  push:
    branches: [main, feat/musescore-source-banks-20261125]
    paths:
      - 'catalog/musescore/**'
      - 'plugins/musescore-bank-*/**'
      - 'plugins/musescore-import/**'
      - 'plugins/abc/src/search-widget.js'
      - 'plugins/abc/src/musescore-bank.js'
      - 'plugins/abc/src/SearchStyles.tid'
      - 'scripts/musescore-archive-browser-smoke.mjs'
      - 'scripts/build-musescore-banks.mjs'
      - 'scripts/assemble-repertoire-source-banks.mjs'
      - 'tests/musescore-banks.test.mjs'
      - '.github/workflows/musescore-source-banks.yml'
  pull_request:
    paths:
      - 'catalog/musescore/**'
      - 'plugins/musescore-bank-*/**'
      - 'plugins/musescore-import/**'
      - 'plugins/abc/src/search-widget.js'
      - 'plugins/abc/src/musescore-bank.js'
      - 'plugins/abc/src/SearchStyles.tid'
      - 'scripts/musescore-archive-browser-smoke.mjs'
      - 'tests/musescore-banks.test.mjs'
      - '.github/workflows/musescore-source-banks.yml'
permissions:
  contents: write
jobs:
  source-banks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project test dependencies
        run: npm ci --ignore-scripts
      - name: Verify original sources and importer packages
        run: |
          node scripts/build-musescore-banks.mjs
          node scripts/build-musescore-banks.mjs --check
          node scripts/build-musescore-import.mjs
          node scripts/build-musescore-import.mjs --check
      - name: Assemble matching public packages and wikis
        run: |
          node scripts/build-abc-ui.mjs
          node scripts/build-forge-plugin-library.mjs
          node scripts/build-forge-home.mjs
          node scripts/assemble-repertoire-source-banks.mjs
      - name: Verify catalogs, import handoff and public home
        run: |
          node scripts/build-abc-ui.mjs --check
          node scripts/build-forge-home.mjs --check
          node --test tests/musescore-banks.test.mjs tests/musescore-veseo.test.mjs tests/musescore-import-layout.test.mjs tests/abc-search-player.test.mjs tests/musescore-harmony.test.mjs tests/forge-libraries.test.mjs tests/forge-home.test.mjs
          git diff --check
      - name: Install the browser test controller
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Check readable archive browsing in narrow story columns
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/musescore-archive-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nodearkiv-layout
          path: test-results/archive/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save the verified public artifacts on the source branch
        if: github.event_name == 'push' && github.ref_name == 'feat/musescore-source-banks-20261125'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- plugins/musescore-bank-akustisk-elektrisk/dist/plugin.json plugins/musescore-bank-silba-atno/dist/plugin.json plugins/musescore-import/dist/plugin.json plugins/abc/dist/plugin.json library/plugins/registry.json index.html editions/forge/tiddlers/edition-index.json editions/forge/tiddlers/featured-plugins.json editions/akustisk-elektrisk-repertoire/index.html editions/silba-atno-repertoire/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'build: assemble verified MuseScore node archives and repertoire wikis'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
