name: AniMus production browser acceptance
on:
  push:
    branches: [main]
    paths:
      - editions/animus/**
      - editions/turn-around/**
      - plugins/musical/**
      - plugins/animus-video-export/**
      - plugins/animus-example-fyrtoejet/**
      - plugins/cutout/**
      - plugins/abc/**
      - plugins/site-publisher/**
      - assembler/**
      - core/**
      - scripts/build-animus.mjs
      - scripts/build-animus-video-export.mjs
      - scripts/build-cutout-ui.mjs
      - scripts/build-abc-ui.mjs
      - scripts/build-site-publisher.mjs
      - scripts/animus-browser-smoke.mjs
      - scripts/animus-face-browser-smoke.mjs
      - tests/animus-video-export*.test.mjs
      - tests/animus-site-view.test.mjs
      - tests/abc-reader-fallback.test.mjs
      - tests/animus-lipsync.test.mjs
      - tests/animus-lipsync-editor.test.mjs
      - tests/animus-direct-edit.test.mjs
      - tests/helpers/svg-test-dom.mjs
      - tests/animus-presentation.test.mjs
      - tests/animus-publication-ui.test.mjs
      - tests/animus-manuscript-render.test.mjs
      - tests/site-layouts.test.mjs
      - .github/workflows/animus-browser-smoke.yml
  pull_request:
    paths:
      - editions/animus/**
      - editions/turn-around/**
      - plugins/musical/**
      - plugins/animus-video-export/**
      - plugins/animus-example-fyrtoejet/**
      - plugins/cutout/**
      - plugins/abc/**
      - plugins/site-publisher/**
      - assembler/**
      - core/**
      - scripts/build-animus.mjs
      - scripts/build-animus-video-export.mjs
      - scripts/build-cutout-ui.mjs
      - scripts/build-abc-ui.mjs
      - scripts/build-site-publisher.mjs
      - scripts/animus-browser-smoke.mjs
      - scripts/animus-face-browser-smoke.mjs
      - tests/animus-video-export*.test.mjs
      - tests/animus-site-view.test.mjs
      - tests/abc-reader-fallback.test.mjs
      - tests/animus-lipsync.test.mjs
      - tests/animus-lipsync-editor.test.mjs
      - tests/animus-direct-edit.test.mjs
      - tests/helpers/svg-test-dom.mjs
      - tests/animus-presentation.test.mjs
      - tests/animus-publication-ui.test.mjs
      - tests/animus-manuscript-render.test.mjs
      - tests/site-layouts.test.mjs
      - .github/workflows/animus-browser-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify reproducible plugin packages
        run: |
          node scripts/build-animus.mjs --check
          node scripts/build-animus-video-export.mjs --check
          node --check plugins/animus-video-export/src/audio.js
          node --check plugins/animus-video-export/src/runtime.js
          node --check plugins/animus-video-export/src/mp4.js
          node --test tests/animus-video-export*.test.mjs
          node scripts/build-cutout-ui.mjs --check
          node scripts/build-abc-ui.mjs --check
          node scripts/build-site-publisher.mjs --check
      - name: Install browser controller
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify B-flat and E-flat written ABC layouts in Chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/abc-transposed-layout-browser-smoke.mjs
      - name: Test standalone Site playback in Chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome
          ANIMUS_BROWSER_TESTS: '1'
        run: node --test tests/animus-site-view.test.mjs
      - name: Test the complete AniMus editing and publication workflow
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/animus-browser-smoke.mjs
      - name: Test face correction through the ordinary Turn Around demo
        if: ${{ !cancelled() }}
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/animus-face-browser-smoke.mjs
      - name: Report complete source suite with bounded diagnostics
        if: always()
        run: |
          node <<'JS'
          const {run}=require('node:test');
          const {readdirSync}=require('node:fs');
          (async()=>{
          const files=readdirSync('tests').filter(name=>name.endsWith('.test.mjs')).map(name=>'tests/'+name);
          let failures=0;
          for await(const event of run({files})) {
            if(event.type==='test:fail') {
              failures++;
              const data=event.data,error=data.details?.error,cause=error?.cause||error;
              console.log('FAIL '+data.name+' ('+(data.file||'')+':'+(data.line||'')+')');
              console.log(String(cause?.message||error||'').slice(0,1600));
            }
            if(event.type==='test:summary') console.log(JSON.stringify(event.data));
          }
          process.exitCode=failures?1:0;
          })().catch(error=>{console.error(error);process.exitCode=1;});
          JS
      - name: Retain screenshots and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animus-browser-acceptance
          path: test-results/animus/
          if-no-files-found: ignore
          retention-days: 7
