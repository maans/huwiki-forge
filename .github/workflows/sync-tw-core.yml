name: Check new TiddlyWiki core candidate
on:
  workflow_dispatch:
  schedule:
    - cron: "25 4 * * 2"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-tw-core.yml"
      - "scripts/sync-tw-core.mjs"
      - "tests/assembler.test.mjs"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch official empty.html and validate marker
        run: node scripts/sync-tw-core.mjs
      - name: Test Edition Assembler
        run: npm test
      - name: Commit candidate for manual review when changed
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- core/candidate-empty.html core/candidate-version.json)" ]]; then
            echo "Official core matches pinned version or candidate unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/candidate-empty.html core/candidate-version.json
          git commit -m "chore: stage official TiddlyWiki core candidate"
          git push
