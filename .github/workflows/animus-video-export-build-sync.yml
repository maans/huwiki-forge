name: AniMus feature branch generated home sync
on:
  push:
    branches:
      - feature/animus-video-export
    paths:
      - catalog/editions.json
      - editions/forge/tiddlers/edition-index.json
      - .github/workflows/animus-video-export-build-sync.yml
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'maans/huwiki-forge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/animus-video-export
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate the public landing wiki from source
        run: node scripts/build-forge-home.mjs
      - name: Commit generated files to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html editions/forge/tiddlers/edition-index.json editions/forge/tiddlers/featured-plugins.json
          if ! git diff --cached --quiet; then
            git commit -m "build(forge): regenerate landing wiki after AniMus version bump"
            git push origin HEAD:feature/animus-video-export
          fi
