name: Build SilbaÄtno Repertoire from verified MuseScore files
# Binary ForgeShare files are handled by .gitattributes; keep CI checkouts clean.
on:
  push:
    branches:
      - feat/silva-ethno-repertoire-20261118
      - fix/silbaatno-home-nodepult-20261118
      - main
    paths:
      - 'editions/silva-ethno-repertoire/sources/**'
      - 'editions/silva-ethno-repertoire/manifest.json'
      - 'editions/silva-ethno-repertoire/tiddlers/songs.json'
      - 'editions/silva-ethno-repertoire/tiddlers/config.json'
      - 'scripts/build-silba-etno-repertoire.mjs'
      - 'scripts/assemble-silba-etno-repertoire.mjs'
      - 'scripts/publish-silba-etno-site.mjs'
      - '.github/workflows/publish-silba-etno-repertoire.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: silba-etno-repertoire-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install XML parser and browser controller
        run: npm install --no-save --no-package-lock --ignore-scripts @xmldom/xmldom@0.9.8 playwright-core@1.56.1
      - name: Convert all 17 MuseScore arrangements through existing importer
        run: node scripts/build-silba-etno-repertoire.mjs
      - name: Assemble native editable Music Edition
        run: node scripts/assemble-silba-etno-repertoire.mjs
      - name: Export original SitePublisher audience HTML
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/publish-silba-etno-site.mjs
      - name: Link editor to verified audience Site
        run: node scripts/assemble-silba-etno-repertoire.mjs --with-site
      - name: Verify repertoire, links and files
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const p='editions/silva-ethno-repertoire/';
          const a=JSON.parse(fs.readFileSync(p+'tiddlers/repertoire.json','utf8'));
          if(a.length!==17||a.some(x=>!x['abc-source']||!x.tags.includes('ABC')))process.exit(1);
          for(const f of ['index.html','site/index.html'])if(!fs.statSync(p+f).size)process.exit(2);
          const wiki=fs.readFileSync(p+'index.html','utf8');
          if(!wiki.includes('https://forge.måns.dk/editions/silva-ethno-repertoire/site/index.html'))process.exit(3);
          if(a.some(x=>!x.tags.includes('SilbaÄtno')||x.title.startsWith('Silba Etno')))process.exit(4);
          console.log('Verified 17 ABC scores and two linked HTML views');
          "
          git diff --check
      - name: Commit verified generated repertoire
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Keep editable wiki index.html owned by build-repertoire-demo.yml.
          # This workflow only publishes the audience site and generated score data.
          git add -- editions/silva-ethno-repertoire/site/index.html editions/silva-ethno-repertoire/tiddlers/repertoire.json editions/silva-ethno-repertoire/conversion-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(silba-etno): publish 17 editable ABC scores and SitePublisher audience view'
            git reset --hard HEAD
            git status --short | head -25
            git stash push -m 'runner-only working-tree changes' --quiet || true
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            pushed=0
            for attempt in 1 2 3 4; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=1
                break
              fi
              echo "Branch moved during SitePublisher export; rebasing and retrying (attempt $attempt)"
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
            done
            test "$pushed" -eq 1
          fi
