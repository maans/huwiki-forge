name: Build instrument-aware MuseScore importer
on:
  push:
    branches: [main]
    paths:
      - 'plugins/musescore-import/**'
      - 'scripts/build-musescore-import.mjs'
      - 'scripts/musescore-browser-smoke.mjs'
      - 'tests/musescore-*.test.mjs'
      - '.github/workflows/build-musescore-import.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: musescore-import-build-main
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node scripts/build-musescore-import.mjs
      - run: node --test tests/musescore-*.test.mjs
      - run: node scripts/build-musescore-import.mjs --check
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify native XML parsing, instrument playback and drum engraving
        run: node scripts/musescore-browser-smoke.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musescore-notation
          path: test-results/musescore/
          retention-days: 7
      - run: node scripts/build-forge-plugin-library.mjs
      - run: node --test tests/forge-libraries.test.mjs
      - name: Update existing Forge wikis
        run: |
          node scripts/build-forge-home.mjs
          python3 - <<'PY'
          import pathlib, subprocess, sys
          files = [pathlib.Path('index.html'), *pathlib.Path('editions').glob('*/index.html')]
          subprocess.run([sys.executable, 'scripts/update_abc_plugin.py', '--title', '$:/plugins/huwiki/musescore-import', '--plugin', 'plugins/musescore-import/dist/plugin.json', *map(str, files)], check=True)
          PY
          git diff --check
      - name: Publish verified importer and matching plugin registry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- plugins/musescore-import/dist/plugin.json library/plugins/registry.json index.html 'editions/*/index.html' editions/forge/tiddlers/edition-index.json editions/forge/tiddlers/featured-plugins.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(musescore): synchronize instrument-aware importer'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
