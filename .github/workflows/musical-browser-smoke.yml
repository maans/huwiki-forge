name: Musical Edition browser smoke
on:
  pull_request:
    paths:
      - 'editions/musical/**'
      - 'plugins/musical/**'
      - 'scripts/musical-browser-smoke.mjs'
      - '.github/workflows/musical-browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  musical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser controller
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Check score, camera and a single playback control
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/musical-browser-smoke.mjs
