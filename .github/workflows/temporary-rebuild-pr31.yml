name: One-time rebuild PR 31 generated Forge homepage
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  regenerate:
    if: ${{ github.event.pull_request.number == 31 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and commit generated Forge homepage
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          node scripts/build-forge-home.mjs
          node scripts/build-forge-home.mjs --check
          git add index.html editions/forge/tiddlers/edition-index.json editions/forge/tiddlers/featured-plugins.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: update generated Forge homepage for F icon'
            git push origin "HEAD:$PR_BRANCH"
          fi
