name: Publish approved Jingle landing wiki

on:
  push:
    branches: [main]
    paths:
      - "admin/publish-approved-jingle-v1.trigger"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build full self-contained Forge wiki from approved manifests
        run: node scripts/build-forge-home.mjs
      - name: Run repository tests before publishing
        run: npm test
      - name: Verify reproducible site
        run: node scripts/build-forge-home.mjs --check
      - name: Publish generated index and edition cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html editions/forge/tiddlers/edition-index.json editions/forge/tiddlers/featured-plugins.json
          if git diff --cached --quiet; then
            echo "Already up to date"
          else
            git commit -m "Publish approved Jingle follow player on Forge"
            git push origin HEAD:main
          fi
