name: Build Graph Edition from verified upstream bundles
on:
  pull_request:
    paths:
      - editions/graph/**
      - plugins/graph-studio/**
      - scripts/build-graph-edition.mjs
      - scripts/graph-browser-smoke.mjs
      - .github/workflows/build-graph-edition.yml
  push:
    branches: [main, fix/graph-context-tools-20261119]
    paths:
      - editions/graph/**
      - plugins/graph-studio/**
      - scripts/build-graph-edition.mjs
      - scripts/graph-browser-smoke.mjs
      - .github/workflows/build-graph-edition.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and verify official plugin bundles, build registry and homepage
        run: node scripts/build-graph-edition.mjs
      - name: Verify Graph Edition and existing Forge tests
        run: |
          npm ci --ignore-scripts
          npm test
          node scripts/build-forge-home.mjs --check
      - name: Install browser smoke-test dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Test live Graph canvas and editability offline in Chromium
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/graph-browser-smoke.mjs
      - name: Generate version-aligned registry and homepage in feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/graph-context-tools-20261119'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library/plugins/registry.json editions/forge/tiddlers/edition-index.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "build(graph): update registry, Edition card and landing wiki"
            git push origin HEAD:fix/graph-context-tools-20261119
          fi
